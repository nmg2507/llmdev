<!-- Flaskが利用している、Jinja2=テンプレートエンジン　
 　の構文でかいている　-->

{% extends "base.html" %}

{% set title_content = "TODOリスト" %}

{% block title %}{{title_content}}{% endblock %}

{% block content %}

<!-- TODOリスト表示 -->

<ul>
  {% for todo in todos %}
  <li>
      {{ todo }}
      <a href="{{ url_for('delete', todo_id=loop.index0) }}" class="delete-button">削除</a>
  </li>
  {% endfor %}
</ul>

<!-- 補足：loop.index0 は、0から始まるループのインデックスを
 　jinja2が取得している。つまりリストのインデックスに一致　-->

<!-- 新規TODO登録フォーム -->
<form method="post" action="/">
  <input type="text" name="todo" placeholder="新しいTODOを追加" required>
  <button type="submit">追加</button>
</form>
{% endblock %}
